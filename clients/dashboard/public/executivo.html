<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2C4A63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Painel Executivo · ER Advocacia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #F4F1EA;
      --bg-card:   #FBFAF5;
      --text:      #2C4A63;
      --text-2:    #5A748B;
      --text-3:    #8295A8;
      --border:    #D9D1BE;
      --hover:     #EFE9D8;
      --success:   #4A7757;
      --warning:   #B07A1F;
      --danger:    #A13D3D;
      --accent:    #C9A35B;
      --radius:    12px;
      --radius-lg: 18px;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      max-width: 560px;
      margin: 0 auto;
      padding: 18px 16px 80px;
    }

    /* Header editorial — Playfair monograma */
    header.hd {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 14px 4px 22px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
    }
    .hd h1 {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.1;
    }
    .hd h1 small {
      display: block;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-top: 4px;
    }
    .hd .stamp {
      font-size: 10px;
      color: var(--text-3);
      text-align: right;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .hd .stamp .live {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--success);
      margin-right: 4px;
      vertical-align: middle;
    }

    /* KPI Card — mobile-first */
    .kpi {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }
    .kpi::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--text-3);
    }
    .kpi.s-verde::before    { background: var(--success); }
    .kpi.s-amarelo::before  { background: var(--warning); }
    .kpi.s-vermelho::before { background: var(--danger); }

    .kpi .lbl {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .kpi .lbl .tag {
      font-size: 9.5px;
      padding: 3px 7px;
      border-radius: 4px;
      background: var(--hover);
      color: var(--text-2);
      letter-spacing: 0.04em;
    }
    .kpi.s-verde    .tag { background: rgba(74,119,87,0.12);  color: var(--success); }
    .kpi.s-amarelo  .tag { background: rgba(176,122,31,0.12); color: var(--warning); }
    .kpi.s-vermelho .tag { background: rgba(161,61,61,0.12);  color: var(--danger); }

    .kpi .val {
      font-family: 'Playfair Display', serif;
      font-size: 32px;
      font-weight: 500;
      line-height: 1.05;
      margin-top: 10px;
      letter-spacing: -0.01em;
    }
    .kpi .val.txt {
      font-family: 'Inter', sans-serif;
      font-size: 22px;
      font-weight: 600;
    }
    .kpi .sub {
      font-size: 12.5px;
      color: var(--text-2);
      margin-top: 6px;
      line-height: 1.4;
    }
    .kpi .sub b {
      color: var(--text);
      font-weight: 600;
    }

    /* Lista interna (vencidas/forecast/leads) */
    .lst {
      list-style: none;
      margin-top: 12px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }
    .lst li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 13px;
      line-height: 1.35;
    }
    .lst li:last-child { border-bottom: none; }
    .lst li .l-name { flex: 1; color: var(--text); }
    .lst li .l-meta { color: var(--text-3); font-size: 11px; white-space: nowrap; }
    .lst li.danger .l-meta { color: var(--danger); font-weight: 600; }

    /* Forecast 3-col strip */
    .fc {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .fc div {
      text-align: center;
      padding: 8px 4px;
      background: var(--surface, var(--bg));
      border-radius: 8px;
    }
    .fc .fc-l {
      font-size: 9.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-3);
    }
    .fc .fc-v {
      font-family: 'Playfair Display', serif;
      font-size: 15px;
      font-weight: 500;
      margin-top: 3px;
      color: var(--text);
    }

    /* Reload bar */
    .reload {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .reload button {
      flex: 1;
      padding: 11px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      border-radius: var(--radius);
      font-family: 'Inter', sans-serif;
      font-size: 12.5px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text-2);
      cursor: pointer;
      transition: background .15s;
    }
    .reload button:hover { background: var(--hover); }
    .reload button.primary {
      background: var(--text);
      color: var(--bg-card);
      border-color: var(--text);
    }

    /* Skeleton */
    .skel {
      background: linear-gradient(90deg, var(--hover), var(--bg-card), var(--hover));
      background-size: 200% 100%;
      animation: shimmer 1.5s linear infinite;
      border-radius: 6px;
      color: transparent;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      background: var(--text);
      color: var(--bg-card);
      border-radius: 8px;
      font-size: 12.5px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      opacity: 0;
      transition: opacity .25s;
      pointer-events: none;
      z-index: 99;
    }
    .toast.show { opacity: 1; }

    /* Link de volta */
    .back {
      display: inline-block;
      margin-top: 20px;
      font-size: 11.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-3);
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
    }
    .back:hover { color: var(--text); border-color: var(--text); }

    @media (min-width: 720px) {
      .shell { max-width: 720px; }
      .kpi { padding: 20px 24px; }
      .kpi .val { font-size: 38px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="hd">
      <h1>
        Painel Executivo
        <small>Eduardo Rodrigues Advocacia</small>
      </h1>
      <div class="stamp">
        <span class="live"></span><span id="stamp">carregando…</span>
      </div>
    </header>

    <div class="reload">
      <button id="btnRefresh" class="primary">↻ Atualizar</button>
      <button id="btnFull" onclick="location.href='/'">Dashboard completo</button>
    </div>

    <div id="kpis">
      <div class="kpi">
        <div class="lbl">Caixa do mês <span class="tag skel">···</span></div>
        <div class="val skel">R$ 0,00</div>
        <div class="sub skel">carregando…</div>
      </div>
      <div class="kpi">
        <div class="lbl">Ticket médio (90d) <span class="tag skel">···</span></div>
        <div class="val skel">R$ 0,00</div>
      </div>
      <div class="kpi">
        <div class="lbl">% Procedência <span class="tag skel">···</span></div>
        <div class="val skel">0%</div>
      </div>
      <div class="kpi">
        <div class="lbl">Vencidas hoje <span class="tag skel">···</span></div>
        <div class="val skel">0</div>
      </div>
      <div class="kpi">
        <div class="lbl">Leads sem resposta <span class="tag skel">···</span></div>
        <div class="val skel">0</div>
      </div>
      <div class="kpi">
        <div class="lbl">Régua de cobrança <span class="tag skel">···</span></div>
        <div class="val skel">0</div>
      </div>
    </div>

    <a href="/" class="back">← voltar ao dashboard</a>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const fmtBRL = v => 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fmtPct = v => Number(v || 0).toFixed(1) + '%';
    const fmtTimeAgo = iso => {
      try {
        const d = new Date(iso);
        const t = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Recife' });
        return `atualizado ${t}`;
      } catch { return 'agora'; }
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    function statusClass(s) {
      return 's-' + (s || 'verde');
    }
    function statusLabel(s) {
      if (s === 'verde')   return 'OK';
      if (s === 'amarelo') return 'Atenção';
      if (s === 'vermelho') return 'Crítico';
      return '—';
    }

    function render(data) {
      const k = data.kpis;
      const cards = [];

      // 1. Caixa do mês
      cards.push(`
        <div class="kpi ${statusClass(k.caixa_mes.status)}">
          <div class="lbl">Caixa do mês · ${k.caixa_mes.mes} <span class="tag">${statusLabel(k.caixa_mes.status)}</span></div>
          <div class="val">${fmtBRL(k.caixa_mes.saldo)}</div>
          <div class="sub">
            Recebido <b>${fmtBRL(k.caixa_mes.recebido)}</b> ·
            Previsto <b>${fmtBRL(k.caixa_mes.previsto)}</b><br>
            Despesas pagas ${fmtBRL(k.caixa_mes.despesas_pagas)}
          </div>
          ${data.forecast ? `
          <div class="fc">
            <div><div class="fc-l">30 dias</div><div class="fc-v">${fmtBRL(data.forecast.d30)}</div></div>
            <div><div class="fc-l">90 dias</div><div class="fc-v">${fmtBRL(data.forecast.d90)}</div></div>
            <div><div class="fc-l">180 dias</div><div class="fc-v">${fmtBRL(data.forecast.d180)}</div></div>
          </div>` : ''}
        </div>
      `);

      // 2. Ticket médio
      cards.push(`
        <div class="kpi s-verde">
          <div class="lbl">Ticket médio (90d) <span class="tag">${k.ticket_medio.casos} casos</span></div>
          <div class="val">${fmtBRL(k.ticket_medio.ticket_medio)}</div>
          <div class="sub">Receita 90d: <b>${fmtBRL(k.ticket_medio.receita_90d)}</b></div>
        </div>
      `);

      // 3. Procedência
      cards.push(`
        <div class="kpi ${statusClass(k.procedencia.status)}">
          <div class="lbl">% Procedência <span class="tag">${statusLabel(k.procedencia.status)}</span></div>
          <div class="val">${fmtPct(k.procedencia.procedencia_pct)}</div>
          <div class="sub">
            <b>${k.procedencia.procedentes}</b> procedentes ·
            <b>${k.procedencia.improcedentes}</b> improcedentes
          </div>
        </div>
      `);

      // 4. Vencidas
      const venc = k.vencidas;
      const lista = (venc.top5 || []).map(t => `
        <li class="${t.dias_atraso > 7 ? 'danger' : ''}">
          <span class="l-name">${t.task} · <em style="color:var(--text-3)">${t.responsavel}</em></span>
          <span class="l-meta">${t.dias_atraso}d</span>
        </li>
      `).join('');
      cards.push(`
        <div class="kpi ${statusClass(venc.status)}">
          <div class="lbl">Tarefas vencidas <span class="tag">${statusLabel(venc.status)}</span></div>
          <div class="val">${venc.total}</div>
          ${lista ? `<ul class="lst">${lista}</ul>` : ''}
        </div>
      `);

      // 5. Leads SLA
      const sla = k.leads_sla || {};
      cards.push(`
        <div class="kpi ${statusClass(sla.status)}">
          <div class="lbl">Leads sem resposta <span class="tag">${statusLabel(sla.status)}</span></div>
          <div class="val">${sla.parados_agora ?? 0}</div>
          <div class="sub">
            SLA: <b>${sla.sla_horas ?? 2}h</b> · pior espera: <b>${sla.max_horas_parado ?? 0}h</b><br>
            7d: <b>${sla.leads_7d ?? 0}</b> leads · <b>${sla.conversao_7d_pct ?? 0}%</b> convertidos
          </div>
        </div>
      `);

      // 6. Régua de cobrança
      const r = k.regua_cobranca || {};
      const porE = r.por_etapa_30d || {};
      cards.push(`
        <div class="kpi ${statusClass(r.status)}">
          <div class="lbl">Régua de cobrança <span class="tag">${statusLabel(r.status)}</span></div>
          <div class="val">${r.execs_7d ?? 0}</div>
          <div class="sub">
            execuções nos últimos 7 dias · <b>${r.escalacoes_7d ?? 0}</b> escalações<br>
            30d: D1=${porE.D1 ?? 0} · D7=${porE.D7 ?? 0} · D15=${porE.D15 ?? 0} · D30=${porE.D30 ?? 0}
          </div>
        </div>
      `);

      document.getElementById('kpis').innerHTML = cards.join('');
      document.getElementById('stamp').textContent = fmtTimeAgo(data.geradoEm);
    }

    async function load(force = false) {
      try {
        document.getElementById('btnRefresh').textContent = '↻ Carregando…';
        const resp = await fetch('/api/executivo' + (force ? '?force=1' : ''), { credentials: 'include' });
        if (resp.status === 401) {
          window.location.href = '/?next=' + encodeURIComponent('/executivo.html');
          return;
        }
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();
        render(data);
        if (force) showToast('Dados atualizados.');
      } catch (e) {
        showToast('Erro: ' + e.message);
        console.error(e);
      } finally {
        document.getElementById('btnRefresh').textContent = '↻ Atualizar';
      }
    }

    document.getElementById('btnRefresh').addEventListener('click', () => load(true));

    // Auto-refresh a cada 5 minutos quando a aba está visível
    let intervalId = null;
    function startAutoRefresh() {
      if (intervalId) return;
      intervalId = setInterval(() => { if (!document.hidden) load(false); }, 5 * 60 * 1000);
    }
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) load(false);
    });

    load();
    startAutoRefresh();
  </script>
</body>
</html>
